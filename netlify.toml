# Netlify 배포 설정. 빌드 명령·출력 폴더는 package.json의 build 스크립트(tsc -b && vite build)와 Vite 기본 출력(dist)에 맞춘다.
# 환경변수(VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY)는 Netlify 사이트 설정 > Environment variables에 입력한다(이 파일에 쓰지 않는다. 자세한 내용: docs/deploy-netlify.md).
# VITE_ 변수는 빌드 결과(브라우저)에 그대로 들어가므로 공개되어도 되는 값만 넣는다(service_role 키·비밀키 금지).

[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router(BrowserRouter) 직접 접속·새로고침 대응: 모든 경로를 index.html로 보낸다(200 rewrite).
# 실제 파일(assets, favicon 등)은 Netlify가 먼저 서빙하므로 이 규칙이 덮어쓰지 않는다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 해시가 붙은 정적 파일은 오래 캐시하고, index.html은 항상 새로 받게 한다(배포 후 구버전이 남지 않게).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
